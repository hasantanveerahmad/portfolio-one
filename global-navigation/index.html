<head>

<title>Global Navigation & Decoupling — Hasan Tanveer Ahmad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F8F5F0;
    --ink: #16140F;
    --ink-2: #2A2823;
    --muted: #615D54;
    --line: #E7E3DC;
    --chip: #F0EDE6;
    --accent: #E2622F;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
  }
  .page {
    max-width: 1024px;
    width: 100%;
    margin: 0 auto;
    padding: 28px 64px 56px;
    }
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0 22px;
  }
  .brand {
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: -0.01em;
    color: var(--ink);
    text-decoration: none;
  }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 1px;
    color: var(--ink);
    text-decoration: none;
    text-transform: uppercase;
    transition: color .15s ease;
  }
  .back-link__icon { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; color: currentColor; }
  .back-link:hover { color: var(--accent); }
  .back-link--next .back-link__label { padding-left: 4px; }
  .back-link:not(.back-link--next) .back-link__label { padding-right: 4px; }
  .page-nav { margin-top: 72px; }
  .page-nav-inner { display: flex; align-items: center; justify-content: space-between; }

  .stage {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    padding: 80px 0 40px;
    gap: 24px;
  }
  .chip {
    display: inline-block;
    background: var(--chip);
    color: var(--ink-2);
    font-size: 10px;
    letter-spacing: 0.08em;
    padding: 6px 10px;
    border-radius: 999px;
    text-transform: uppercase;
  }
  h1 {
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: 52px;
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 0;
    max-width: 960px;
  }
  .teaser {
    color: var(--muted);
    font-size: 24px;
    line-height: 1.55;
    max-width: 960px;
    margin: 0;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--accent);
    text-transform: uppercase;
    margin-top: 8px;
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--accent);
  }
@media (max-width: 720px) {
    .page { padding: 24px 24px 40px; }
    h1 { font-size: 44px; }
    .stage { padding: 48px 0 32px; }
  }

  /* ---------- Footer (matches homepage) ---------- */
  .site-footer {
    width: 100vw;
    margin-left: calc(50% - 50vw);
    border-top: 0;
    padding: 32px 0;
    background: #FFFFFF;
  }
  .site-footer__inner {
    max-width: 1024px;
    margin: 0 auto;
    padding: 0 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }
  .site-footer__copy {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.18em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .site-footer__links {
    display: flex;
    gap: 44px;
  }
  .site-footer__links a {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.18em;
    color: var(--muted);
    text-decoration: none;
    text-transform: uppercase;
    transition: color .15s ease;
  }
  .site-footer__links a:hover {
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  @media (max-width: 640px) {
    .site-footer__inner {
      flex-direction: column;
      gap: 16px;
      align-items: flex-start;
      padding: 0 clamp(16px, 5vw, 28px);
    }
    .site-footer__links {
      gap: 18px;
      flex-wrap: wrap;
    }
  }

</style>
</head>
<body>
  <div class="page">
    <nav class="nav">
      <a class="back-link" href="../index.html">

        </span>
        <span class="back-link__label">Back to Homepage</span>

    </nav>

    <main class="stage">
      <h1>Global Navigation & Decoupling</h1>
      <p class="teaser">A three-phase simplification of an overloaded multi-brand navigation that created clear, independent experiences for The LYCRA Company and its brands.</p>
      <div class="status"><span class="dot"></span> Case study coming soon</div>
    </main>
    <nav class="page-nav">
      <div class="page-nav-inner">

          </span>
          <span class="back-link__label">Back to Homepage</span>

          <span class="back-link__label">Next Project</span>
          <span class="back-link__icon" aria-hidden="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5l7 7-7 7"></path></svg>

  </div>
    <footer class="site-footer">
      <div class="site-footer__inner">
        <span class="site-footer__copy">© 2026 HAAS PORTFOLIO</span>
        <nav class="site-footer__links">
          <a id="copyEmail" href="#">Copy email</a>
          <a href="../assets/Hasan_Ahmad_Resume_v5.pdf" target="_blank" rel="noopener">View Resume</a>
        </nav>
      </div>
    </footer>
<script>
  (function () {
    var link = document.getElementById('copyEmail');
    if (!link) return;
    link.addEventListener('click', function (e) {
      e.preventDefault();
      var email = 'hasantanveerahmad@gmail.com';
      var done = function () {
        var prev = link.textContent;
        link.textContent = 'Copied ✓';
        setTimeout(function () { link.textContent = prev; }, 1600);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(email).then(done).catch(done);
      } else { done(); }
    });
  })();
</script>
